<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Etizan teaser</title>
<style>
@font-face { font-family: 'Cairo'; src: url('assets/cairo.woff2') format('woff2'); font-weight: 200 1000; }
:root { --blue-900: #0A3D91; --blue-700: #0265B5; --sky-400: #18B1FE; --sky-100: #D9F0FD; --cyan: #04F1FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #020816; }
body { font-family: 'Cairo', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #0b2a63 0%, #04122e 45%, #020816 100%); }
#glow { position: absolute; left: 50%; top: 45%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%;
  background: radial-gradient(circle, rgba(24,177,254,.55) 0%, rgba(24,177,254,.12) 35%, rgba(24,177,254,0) 62%); opacity: 0; }
.leak { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0; }
#scan { position: absolute; inset: 0; opacity: .07; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 1px, transparent 1px 4px); }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%); z-index: 60; }

/* اللوحات الزجاجية */
#world { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 45%; }
.panel { position: absolute; left: 50%; top: 46%; width: 780px; height: 1000px; margin: -500px 0 0 -390px; border-radius: 56px; overflow: hidden; opacity: 0;
  transform-style: preserve-3d; background: #0a1a3a;
  box-shadow: 0 0 0 2px rgba(217,240,253,.35), 0 0 70px rgba(24,177,254,.55), 0 50px 120px rgba(0,0,0,.6); }
.panel img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.panel .gloss { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(125deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.06) 28%, rgba(255,255,255,0) 45%, rgba(24,177,254,.10) 100%); }
.panel .sweep { position: absolute; top: -20%; bottom: -20%; width: 220px; left: -300px; transform: skewX(-18deg);
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.35), rgba(255,255,255,0)); }
.panel .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,18,46,.0) 40%, rgba(4,18,46,.65) 100%); }
.panel.fragment { width: 520px; height: 300px; margin: -150px 0 0 -260px; border-radius: 40px; }

/* الكلام */
.txt { position: absolute; left: 60px; right: 60px; text-align: center; font-weight: 900; line-height: 1.25; z-index: 50;
  text-shadow: 0 0 22px rgba(24,177,254,.85), 0 0 60px rgba(24,177,254,.45), 0 4px 18px rgba(0,0,0,.6); }
.txt .w { display: inline-block; opacity: 0; margin: 0 8px; }
#flash { position: absolute; inset: 0; background: #e8f6ff; opacity: 0; z-index: 70; mix-blend-mode: screen; }
#logo { position: absolute; left: 50%; top: 640px; width: 760px; margin-left: -380px; filter: brightness(0) invert(1); opacity: 0; z-index: 55; }
#logoGlow { position: absolute; left: 50%; top: 560px; width: 1000px; height: 500px; margin-left: -500px; border-radius: 50%; z-index: 54; opacity: 0;
  background: radial-gradient(ellipse, rgba(24,177,254,.6) 0%, rgba(24,177,254,0) 65%); }
#badge { position: absolute; left: 50%; top: 1330px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 14px; padding: 12px 34px; border-radius: 999px; z-index: 55;
  background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.4); font-weight: 800; font-size: 36px; opacity: 0; white-space: nowrap; }
#badge .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 14px var(--cyan); }
#black { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 80; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="leaks"></div>
  <div id="world"></div>
  <div id="texts"></div>
  <div id="logoGlow"></div>
  <img id="logo" src="assets/logo-full.png">
  <div id="badge"><span class="dot"></span><span>التحديث الجديد</span></div>
  <div id="scan"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="black"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="plan.js"></script>
<script>
function BUILD() {
  const $ = id => document.getElementById(id);
  const P = window.PLAN, tl = gsap.timeline({ paused: true });


  // بقع ضوء بتتحرك ببطء
  [[120, 300, 520, '#18B1FE'], [700, 1300, 600, '#0265B5'], [600, 200, 380, '#04F1FF']].forEach(([x, y, s, c], i) => {
    const d = document.createElement('div'); d.className = 'leak'; Object.assign(d.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px', background: c });
    $('leaks').appendChild(d);
    tl.fromTo(d, { opacity: 0 }, { opacity: 0.22, duration: 2 }, 0.3 + i * 0.4);
    tl.to(d, { x: (i % 2 ? -160 : 160), y: (i ? 120 : -120), duration: P.end, ease: 'sine.inOut' }, 0);
  });

  // صدمة: فلاش + هزة
  function hit(t, k = 1) {
    tl.fromTo('#flash', { opacity: 0.55 * k }, { opacity: 0, duration: 0.35 * k + 0.1, ease: 'power2.out' }, t);
    tl.to('#world', { x: 14 * k, y: -9 * k, duration: 0.04, ease: 'none' }, t);
    tl.to('#world', { x: -11 * k, y: 7 * k, duration: 0.05, ease: 'none' }, t + 0.04);
    tl.to('#world', { x: 6 * k, y: -3 * k, duration: 0.05, ease: 'none' }, t + 0.09);
    tl.to('#world', { x: 0, y: 0, duration: 0.08, ease: 'power1.out' }, t + 0.14);
  }
  P.sfx.forEach(s => { if (s.name === 'impact') hit(s.t, 1); else if (s.name === 'lowhit') hit(s.t, 0.45); else if (s.name === 'glitch') hit(s.t, 0.35); });

  // اللوحات
  P.shots.forEach((s, i) => {
    const p = document.createElement('div'); p.className = 'panel' + (s.mode === 'fragment' ? ' fragment' : '');
    const img = document.createElement('img'); img.src = '../screens/' + s.img + '.png';
    p.appendChild(img); ['tint', 'gloss', 'sweep'].forEach(c => { const e = document.createElement('div'); e.className = c; p.appendChild(e); });
    $('world').appendChild(p);
    const pw = s.mode === 'fragment' ? 520 : 780, ph = s.mode === 'fragment' ? 300 : 1000;
    // الصورة متكبّرة حوالين نقطة الاهتمام
    const scale = (pw / 390) * s.zoom / 3;
    const pos = z => ({ x: pw / 2 - s.fx * 3 * scale * z, y: ph / 2 - s.fy * 3 * scale * z, scale: scale * z });
    const d = s.t1 - s.t0, rapid = s.mode === 'rapid', frag = s.mode === 'fragment';
    tl.fromTo(img, pos(1), { ...pos(1.18), duration: d + 0.3, ease: 'none' }, s.t0);
    // دخول: من blur ودوران، وكشف جزئي بقناع بيكبر
    const inD = rapid ? 0.12 : 0.45, outD = rapid ? 0.1 : 0.4;
    tl.fromTo(p, { opacity: 0, rotationY: s.rot * 2.2, rotationX: 6, z: -380, filter: 'blur(26px)', '--m': '0%' },
      { opacity: 1, rotationY: s.rot, rotationX: 4, z: 0, filter: frag ? 'blur(9px)' : 'blur(2px)', duration: inD, ease: 'power3.out' }, s.t0);
    tl.to(p, { rotationY: s.rot * 0.55, duration: Math.max(0.1, d - inD - outD), ease: 'none' }, s.t0 + inD);
    // التفاصيل بتتغبّش تاني قبل ما المشاهد يستوعبها
    if (!rapid) tl.to(p, { filter: 'blur(14px)', duration: 0.35, ease: 'power1.in' }, s.t1 - outD - 0.25);
    tl.to(p, { opacity: 0, z: rapid ? 120 : 260, rotationY: -s.rot, filter: 'blur(28px)', duration: outD, ease: 'power2.in' }, s.t1 - outD);
    tl.fromTo(p.querySelector('.sweep'), { left: -300 }, { left: pw + 100, duration: Math.min(0.9, d), ease: 'power2.inOut' }, s.t0 + inD * 0.6);
    // القناع: بيكشف دايرة بس من الشاشة
    p.style.webkitMaskImage = p.style.maskImage = 'radial-gradient(ellipse at 50% 50%, #000 var(--m), transparent calc(var(--m) + 22%))';
    tl.fromTo(p, { '--m': frag ? '0%' : '10%' }, { '--m': frag ? '38%' : '70%', duration: d * 0.6, ease: 'power2.out' }, s.t0);
  });
  tl.fromTo('#glow', { opacity: 0 }, { opacity: 0.7, duration: 1.4 }, 0.15);

  // الكلام كلمة كلمة
  P.texts.forEach(x => {
    const d = document.createElement('div'); d.className = 'txt'; d.style.top = x.y + 'px'; d.style.fontSize = x.size + 'px';
    const words = x.text.split(/\s+/);
    d.innerHTML = words.map(w => '<span class="w">' + w + '</span>').join(' ');
    $('texts').appendChild(d);
    const ws = d.querySelectorAll('.w'), vo = P.vo.find(v => Math.abs(v.t - x.t) < 0.06);
    const span = vo ? vo.dur : Math.min(0.9, (x.end - x.t) * 0.5);
    const total = words.reduce((a, w) => a + w.length + 1, 0); let acc = 0;
    ws.forEach((w, k) => { let at = x.t + span * (acc / total); acc += words[k].length + 1; if (x.wt && x.wt[k] != null) at = x.wt[k];
      tl.fromTo(w, { opacity: 0, y: 26, filter: 'blur(12px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.28, ease: 'power3.out' }, at - 0.04); });
    if (x.end < P.end) tl.to(d, { opacity: 0, filter: 'blur(14px)', y: -20, duration: 0.25 }, x.end - 0.25);
  });

  // السكتة قبل الصدمة الأخيرة
  tl.to(['#glow', '#leaks'], { opacity: 0, duration: 0.25 }, P.revealEnd);
  // اللوجو بيطلع تدريجي من الـblur
  const I = P.impact;
  tl.fromTo('#logo', { opacity: 0, scale: 1.35, filter: 'brightness(0) invert(1) blur(40px)' },
    { opacity: 1, scale: 1, filter: 'brightness(0) invert(1) blur(0px)', duration: 1.2, ease: 'power3.out' }, I);
  tl.fromTo('#logoGlow', { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.9, ease: 'power2.out' }, I);
  tl.to('#glow', { opacity: 0.5, duration: 1.2 }, I + 0.1);
  tl.fromTo('#badge', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, P.badge || I + 1.35);
  // قفلة «جاية!»: الكلام بيطلع لقدّام + فلاش + هزة + نبضة نور ورا اللوجو
  if (P.punch) {
    const last = [...document.querySelectorAll('#texts .txt')].pop();
    tl.fromTo(last, { scale: 1 }, { scale: 1.16, duration: 0.09, ease: 'power2.out' }, P.punch);
    tl.to(last, { scale: 1.06, duration: 0.35, ease: 'power2.out' }, P.punch + 0.09);
    tl.fromTo('#logo', { scale: 1 }, { scale: 1.06, duration: 0.09, ease: 'power2.out' }, P.punch);
    tl.to('#logo', { scale: 1.02, duration: 0.4, ease: 'power2.out' }, P.punch + 0.09);
    tl.fromTo('#logoGlow', { scale: 1.35, opacity: 1 }, { scale: 1, opacity: 0.85, duration: 0.6, ease: 'power2.out' }, P.punch);
    hit(P.punch, 0.9);
  }
  // قطع للأسود على البووم
  tl.set('#black', { opacity: 1 }, P.black || P.end - 0.4);
  tl.set({}, {}, P.end);
  window.seek = t => { tl.seek(t, false); };
  window.seek(0);
}
window.READY = Promise.all([document.fonts.load('900 80px Cairo'), document.fonts.load('800 36px Cairo')]).then(() => { BUILD(); return Promise.all([...document.images].map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))); });
</script>
</body>
</html>
