    tl.fromTo(s, { opacity: 0, scale: 1.5, rotation: rot * 3 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.45, ease: 'back.out(1.4)' }, t); fx('slap', t + 0.15, 0.7); return s; };
  // شارة الفصل فوق
  function chapter(text, t0, t1, look = 'glass', dot = 'var(--cyan-dot)') {
    const c = el('div', 'pill ' + look, '<span class="dot" style="background:' + dot + ';box-shadow:0 0 12px ' + dot + '"></span>' + text, $('hud'), { opacity: 0, fontSize: px(L(30, 32)) });
    if (O === 'h') Object.assign(c.style, { top: '64px', right: '110px' }); else center(c, 540, 90);
    tl.fromTo(c, { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4 }, t0); tl.to(c, { opacity: 0, duration: 0.3 }, t1); return c;
  }
  // ── حركة الخلفية الزرقا ──
  Object.assign($('g1').style, { width: px(L(1400, 1300)), height: px(L(1400, 1300)), left: px(L(-300, -500)), top: px(L(-500, -300)) });
  Object.assign($('g2').style, { width: px(L(1200, 1200)), height: px(L(1200, 1200)), left: px(L(1000, 300)), top: px(L(400, 1100)) });
  tl.to('#g1', { x: 220, y: 160, duration: DUR, ease: 'sine.inOut' }, 0); tl.to('#g2', { x: -240, y: -180, duration: DUR, ease: 'sine.inOut' }, 0);
  tl.to('#bgBlue .dots, #bgLight .dots', { y: 56 * 4, duration: DUR, ease: 'none' }, 0);

  E.build({ O, SW, SH, L, px, $, tl, fx, dyn, lerp, ease, el, world, scene, pop, rise, out, center, capWords, words, strike, foot, laptop, trace, chip, sticky, chapter, T, P, LN, DUR, AR, BOX_REAL });

  tl.to({}, { duration: 0.01 }, DUR - 0.01);
  window.PLAN = { duration: +DUR.toFixed(3), sfx: SFX.sort((a, b) => a.t - b.t), cuts: CUTS, worlds: WORLD.sort((a, b) => a.t - b.t), tailStart: LN[LN.length - 1].t1 };
  window.DURATION = DUR;
  window.seek = async t => { tl.seek(t, false); await Promise.all(DYN.map(f => f(t)).filter(Boolean)); };
  return window.seek(0);
}
window.READY = document.fonts.load('900 60px Cairo').then(() => document.fonts.load('800 60px Cairo')).then(() => document.fonts.ready).then(() => BUILD());
