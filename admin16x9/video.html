<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Etizan org dashboard explainer</title>
<link rel="stylesheet" href="assets/fontawesome/all.min.css">
<style>
@font-face { font-family: 'Cairo'; src: url('assets/cairo.woff2') format('woff2'); font-weight: 200 1000; }
:root { --blue-900: #0A3D91; --blue-700: #0265B5; --blue-500: #1E88D4; --sky-400: #18B1FE; --sky-100: #D9F0FD; --cyan: #04F1FF; --ink: #123161;
  --shadow-card: 0 12px 28px rgba(10,61,145,0.28); --shadow-float: 0 30px 60px rgba(2,40,100,0.40); --shadow-text: 0 0 18px rgba(255,255,255,0.45); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--blue-900); }
body { font-family: 'Cairo', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(160deg, var(--blue-900) 0%, var(--blue-700) 55%, var(--blue-500) 100%); }
#glow { position: absolute; width: 1800px; height: 1300px; left: 60px; top: 50px; border-radius: 50%; background: radial-gradient(ellipse, rgba(24,177,254,.6) 0%, rgba(24,177,254,.18) 38%, rgba(24,177,254,0) 65%); }
#grid { position: absolute; inset: 0; opacity: .06; background-image: linear-gradient(rgba(255,255,255,.9) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,.9) 1.5px, transparent 1.5px); background-size: 80px 80px; }
.orb { position: absolute; border-radius: 50%; background: #fff url('assets/logo-mark.png') center/78% no-repeat; filter: blur(10px); }

/* الهيدر */
#logo { position: absolute; top: 34px; right: 48px; height: 66px; filter: brightness(0) invert(1); opacity: 0; z-index: 30; }
#head { position: absolute; top: 34px; right: 250px; height: 70px; display: flex; align-items: center; gap: 18px; opacity: 0; z-index: 30; }
#badge { display: inline-flex; align-items: center; gap: 12px; padding: 8px 24px; border-radius: 999px; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.45); font-weight: 800; font-size: 28px; white-space: nowrap; }
#badge .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
#title { font-weight: 900; font-size: 50px; text-shadow: var(--shadow-text); white-space: nowrap; }
#scope { position: absolute; top: 40px; left: 48px; display: flex; align-items: center; gap: 12px; z-index: 30; opacity: 0; }
#scope .lbl { font-size: 24px; font-weight: 700; color: var(--sky-100); }
#scope .pill { display: inline-flex; align-items: center; gap: 12px; padding: 9px 24px; border-radius: 999px; background: #fff; color: var(--blue-700); font-weight: 900; font-size: 28px; box-shadow: 0 0 24px rgba(24,177,254,.6); }

/* شباك المتصفح */
.win { position: absolute; border-radius: 22px; overflow: hidden; background: #0b1730; box-shadow: var(--shadow-float), 0 0 70px rgba(24,177,254,.45); opacity: 0; }
.win .bar { height: 44px; background: linear-gradient(#f4f7fe, #e6eefb); display: flex; align-items: center; gap: 10px; padding: 0 18px; direction: ltr; }
.win .bar i.d { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.win .url { flex: 1; margin: 0 80px; height: 28px; border-radius: 14px; background: #fff; color: #4A6690; font: 600 16px Cairo; display: flex; align-items: center; justify-content: center; gap: 8px; }
.win .scr { position: absolute; left: 0; top: 44px; right: 0; bottom: 0; overflow: hidden; background: #fff; }
.win .scr img { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
#win { left: 315px; top: 150px; width: 1290px; height: 850px; z-index: 10; }
#winL, #winR { top: 200px; width: 860px; height: 582px; z-index: 12; }
#winR { left: 80px; } #winL { left: 980px; }
.winlbl { position: absolute; top: 132px; width: 860px; text-align: center; z-index: 13; opacity: 0; }
.winlbl span { display: inline-flex; align-items: center; gap: 12px; padding: 8px 26px; border-radius: 999px; background: #fff; color: var(--blue-700); font-weight: 900; font-size: 32px; }
#lblR { left: 80px; } #lblL { left: 980px; }
.spot { position: absolute; border-radius: 16px; border: 4px solid var(--sky-400); opacity: 0; z-index: 10; pointer-events: none;
  box-shadow: 0 0 0 3000px rgba(6,24,66,0.45), 0 0 30px rgba(24,177,254,0.95), inset 0 0 18px rgba(24,177,254,0.4); }

/* الموبايل */
#phone { position: absolute; left: 60px; top: 170px; width: 384px; height: 820px; border-radius: 56px; padding: 10px; opacity: 0; z-index: 25;
  background: linear-gradient(145deg, #c9dcf5, #6f8fbf 40%, #1d3f73); box-shadow: var(--shadow-float), 0 0 60px rgba(24,177,254,0.6); }
#phone::before { content: ''; position: absolute; inset: 4px; border-radius: 52px; background: #0b1730; }
#pscr { position: absolute; left: 18px; top: 18px; width: 348px; height: 784px; border-radius: 42px; overflow: hidden; background: #fff; }
#pscr img { position: absolute; left: 0; top: 0; width: 348px; opacity: 0; }
#pisland { position: absolute; top: 14px; left: 50%; width: 110px; height: 30px; margin-left: -55px; border-radius: 16px; background: #070d1c; z-index: 5; }
#pspot { position: absolute; border-radius: 18px; border: 4px solid var(--sky-400); opacity: 0; z-index: 4; box-shadow: 0 0 0 3000px rgba(6,24,66,0.4), 0 0 24px rgba(24,177,254,.9); }
#plabel { position: absolute; left: 60px; top: 1004px; width: 384px; text-align: center; font-weight: 800; font-size: 24px; color: var(--sky-100); opacity: 0; z-index: 25; }

/* المكبّر */
#mag { position: absolute; overflow: hidden; border-radius: 22px; background: #fff; opacity: 0; z-index: 20;
  box-shadow: 0 0 0 5px #fff, 0 0 0 9px var(--sky-400), 0 30px 70px rgba(2,30,80,0.5), 0 0 50px rgba(24,177,254,0.85); }
#mag img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* كروت */
.chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 18px 30px; border-radius: 16px; font-weight: 900; font-size: 34px; box-shadow: var(--shadow-card); opacity: 0; z-index: 28; white-space: nowrap; }
.chip.blue { background: linear-gradient(145deg, var(--blue-500), var(--blue-700)); color: #fff; }
.chip.white { background: linear-gradient(145deg, #fff, var(--sky-100)); color: var(--blue-700); }

/* الكابشن */
#cap { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: max-content; max-width: 1720px; z-index: 40; }
#cap .line { display: none; padding: 12px 34px; border-radius: 22px; background: rgba(5,26,72,.88); box-shadow: 0 10px 30px rgba(0,0,0,.35); text-align: center; font-weight: 800; font-size: 32px; line-height: 1.5; }
.w { display: inline-block; opacity: 0; margin: 0 4px; }

/* المقدمة والختام */
.layer { position: absolute; inset: 0; opacity: 0; z-index: 35; }
.big { position: absolute; left: 100px; right: 100px; text-align: center; font-weight: 900; text-shadow: var(--shadow-text); }
.tcard { position: absolute; top: 590px; width: 440px; height: 250px; border-radius: 26px; background: linear-gradient(145deg, #fff, var(--sky-100)); color: var(--blue-700); box-shadow: var(--shadow-float);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-weight: 900; font-size: 40px; opacity: 0; }
.tcard i { width: 96px; height: 96px; border-radius: 26px; background: var(--blue-700); color: #fff; font-size: 46px; display: flex; align-items: center; justify-content: center; }
.vcard { position: absolute; top: 470px; width: 470px; height: 300px; border-radius: 26px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.45); box-shadow: var(--shadow-float);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; opacity: 0; text-align: center; }
.vcard i { font-size: 56px; color: var(--sky-100); }
.vcard b { font-size: 40px; font-weight: 900; } .vcard small { font-size: 26px; font-weight: 700; color: var(--sky-100); }
.vcard .soon { position: absolute; top: -22px; padding: 6px 22px; border-radius: 999px; background: #F5E6A3; color: var(--ink); font-weight: 900; font-size: 24px; }
#legend { position: absolute; left: 50%; top: 380px; transform: translateX(-50%); display: flex; gap: 30px; z-index: 36; }
#legend .pill { display: inline-flex; align-items: center; gap: 14px; padding: 18px 40px; border-radius: 999px; background: #fff; color: var(--blue-700); font-weight: 900; font-size: 44px; box-shadow: 0 0 40px rgba(24,177,254,.8); opacity: 0; }
#flash { position: absolute; inset: 0; background: #e8f6ff; opacity: 0; z-index: 70; mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div><div id="grid"></div><div id="orbs"></div>
  <div class="win" id="win"><div class="bar"><i class="d" style="background:#ff5f57"></i><i class="d" style="background:#febc2e"></i><i class="d" style="background:#28c840"></i><div class="url"><i class="fa-solid fa-lock" style="font-size:13px"></i> etizan · لوحة المؤسسة</div></div><div class="scr" id="scr"><div class="spot" id="spot"></div></div></div>
  <div class="win" id="winR"><div class="bar"><i class="d" style="background:#ff5f57"></i><i class="d" style="background:#febc2e"></i><i class="d" style="background:#28c840"></i><div class="url">etizan</div></div><div class="scr" id="scrR"><div class="spot" id="spotR"></div></div></div>
  <div class="win" id="winL"><div class="bar"><i class="d" style="background:#ff5f57"></i><i class="d" style="background:#febc2e"></i><i class="d" style="background:#28c840"></i><div class="url">etizan</div></div><div class="scr" id="scrL"><div class="spot" id="spotL"></div></div></div>
  <div class="winlbl" id="lblR"><span></span></div><div class="winlbl" id="lblL"><span></span></div>
  <div id="phone"><div id="pscr"><div id="pisland"></div><div id="pspot"></div></div></div>
  <div id="plabel">عند العضو في التطبيق</div>
  <div id="mag"><img id="magImg"></div>
  <div id="chips"></div>
  <img id="logo" src="assets/logo-full.png">

  <div id="scope"><span class="lbl">متاح عند</span><span class="pill"><i id="scopeIc" class="fa-solid fa-circle-check"></i><span id="scopeTxt"></span></span></div>
  <div class="layer" id="intro">
    <img id="iLogo" src="assets/logo-full.png" style="position:absolute;left:50%;top:150px;width:560px;margin-left:-280px;filter:brightness(0) invert(1)">
    <div class="big" id="iTitle" style="top:405px;font-size:80px">لوحة المؤسسات</div>
  </div>
  <div id="legend"></div>
  <div class="layer" id="outro"></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="script.js"></script>
<script src="scenes.js"></script>
<script src="times.js"></script>
<script src="../screens/rects.js"></script>
<script>
function BUILD() {
  const $ = id => document.getElementById(id);
  const tl = gsap.timeline({ paused: true }), SFX = [];
  const DUR = window.TIMES.duration, T = window.TIMES.lines;
  const LINES = SCRIPT.flatMap(s => s.lines);
  const all = LINES.map((ln, i) => ({ ln, sc: SCENES[i], t0: T[i].start, t1: T[i].end, wt: T[i].w, next: T[i + 1] ? T[i + 1].start : DUR }));
  const W = (a, k) => { const v = a.wt && a.wt[k]; return v != null ? v : a.t0 + (a.t1 - a.t0) * k / a.ln.t.split(/\s+/).length; };

  [[-90, 300, 280, .14], [1700, 520, 240, .16], [1650, 900, 320, .12], [-120, 860, 260, .14]].forEach(([x, y, s, o], i) => {
    const d = document.createElement('div'); d.className = 'orb'; Object.assign(d.style, { left: x + 'px', top: y + 'px', width: s + 'px', height: s + 'px', opacity: o }); $('orbs').appendChild(d);
    tl.to(d, { y: (i % 2 ? -50 : 50), duration: DUR, ease: 'sine.inOut' }, 0); });

  // ── كابشن ──
  function caption(a) {
    const box = document.createElement('div'); box.className = 'line'; const words = a.ln.t.split(/\s+/);
    box.innerHTML = words.map(w => '<span class="w">' + w + '</span>').join(' '); $('cap').appendChild(box);
    tl.set(box, { display: 'block' }, a.t0 - 0.15); tl.fromTo(box, { opacity: 0 }, { opacity: 1, duration: 0.2 }, a.t0 - 0.15);
    box.querySelectorAll('.w').forEach((w, k) => tl.fromTo(w, { opacity: 0.15 }, { opacity: 1, duration: 0.2 }, W(a, k) - 0.05));
    tl.set(box, { display: 'none' }, a.next - 0.05);
  }

  // ── شبابيك: صورة لكل شاشة جوّه كل شباك ──
  const WINS = { main: { scr: 'scr', spot: 'spot', x: 315, y: 194, w: 1290, cur: null, spotOn: false },
                 R: { scr: 'scrR', spot: 'spotR', x: 80, y: 244, w: 860, cur: null, spotOn: false },
                 L: { scr: 'scrL', spot: 'spotL', x: 980, y: 244, w: 860, cur: null, spotOn: false } };
  const imgs = {};
  function img(win, name) {
    const k = win + ':' + name; if (!imgs[k]) { const im = document.createElement('img'); im.src = '../screens/' + name + '.png'; $(WINS[win].scr).appendChild(im); imgs[k] = im; } return imgs[k];
  }
  function show(win, name, t) {
    const Wn = WINS[win]; if (Wn.cur === name) return;
    if (Wn.cur) tl.to(img(win, Wn.cur), { opacity: 0, duration: 0.3 }, t);
    tl.fromTo(img(win, name), { opacity: 0 }, { opacity: 1, duration: 0.35 }, t); Wn.cur = name;
  }
  let magOn = false;
  function magnify(win, name, r, t) {
    if (magOn) { tl.to('#mag', { opacity: 0, scale: 0.92, duration: 0.2 }, t - 0.4); magOn = false; }
    if (!r || win !== 'main') return;
    const K = WINS.main.w / 1440, p = 8, M = Math.min(1.9, 1500 / (r.w + p * 2), 420 / (r.h + p * 2));
    if (M < K * 1.35) return;
    const w = (r.w + p * 2) * M, h = (r.h + p * 2) * M, cy = WINS.main.y + (r.y + r.h / 2) * K;
    const top = Math.max(170, Math.min(960 - h, cy < 560 ? cy + r.h * K / 2 + 40 : cy - r.h * K / 2 - 40 - h));
    tl.set('#mag', { left: 960 - w / 2, top, width: w, height: h }, t - 0.2);
    tl.set('#magImg', { attr: { src: '../screens/' + name + '.png' }, width: 1440 * M, x: -(r.x - p) * M, y: -(r.y - p) * M }, t - 0.2);
    tl.fromTo('#mag', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.5)', transformOrigin: '50% 50%' }, t);
    SFX.push({ t, name: 'swish', gain: 0.35 }); magOn = true;
  }
  function focus(win, name, key, t, dur = 0.7) {
    const Wn = WINS[win], K = Wn.w / 1440, r = key ? (RECTS[name] && RECTS[name].rects[key]) : null, sp = '#' + Wn.spot;
    if (key && !r) console.warn('missing', name, key);
    if (r) { const pad = 6, box = { left: (r.x - pad) * K, top: (r.y - pad) * K, width: (r.w + pad * 2) * K, height: (r.h + pad * 2) * K };
      if (!Wn.spotOn) { tl.set(sp, box, t); tl.fromTo(sp, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)', transformOrigin: '50% 50%' }, t + 0.25); }
      else tl.to(sp, { ...box, duration: dur, ease: 'power3.inOut' }, t);
      Wn.spotOn = true; SFX.push({ t: t + 0.3, name: 'pop', gain: 0.7 });
    } else if (Wn.spotOn) { tl.to(sp, { opacity: 0, duration: 0.3 }, t); Wn.spotOn = false; }
    magnify(win, name, r, t + 0.55);
  }
  // ── الموبايل ──
  let phoneOn = false, pCur = null, pSpot = false;
  const PK = 348 / 390, PVIEW = 784 / PK;
  function phone(name, key, t) {
    if (!phoneOn) { tl.fromTo('#phone', { opacity: 0, x: -420 }, { opacity: 1, x: 0, duration: 0.6, ease: 'power3.out' }, t); tl.fromTo('#plabel', { opacity: 0 }, { opacity: 1, duration: 0.4 }, t + 0.3);
      tl.to('#win', { x: 170, scale: 0.86, duration: 0.6, ease: 'power3.inOut', transformOrigin: '100% 50%' }, t); phoneOn = true; SFX.push({ t, name: 'whoosh', gain: 0.6 }); }
    const k = 'p:' + name; if (!imgs[k]) { const im = document.createElement('img'); im.src = '../screens/' + name + '.png'; $('pscr').appendChild(im); imgs[k] = im; }
    if (pCur !== name) { if (pCur) tl.to(imgs['p:' + pCur], { opacity: 0, duration: 0.3 }, t); tl.fromTo(imgs[k], { opacity: 0 }, { opacity: 1, duration: 0.35 }, t); pCur = name; }
    const S = RECTS[name], r = key ? S.rects[key] : null;
    const scroll = r ? Math.max(0, Math.min(S.H - PVIEW, r.y + r.h / 2 - PVIEW * 0.45)) : 0;
    tl.to(imgs[k], { y: -scroll * PK, duration: 0.7, ease: 'power3.inOut' }, t);
    if (r) { const box = { left: (r.x - 6) * PK, top: (r.y - scroll - 6) * PK, width: (r.w + 12) * PK, height: (r.h + 12) * PK };
      if (!pSpot) { tl.set('#pspot', box, t + 0.2); tl.fromTo('#pspot', { opacity: 0 }, { opacity: 1, duration: 0.35 }, t + 0.5); } else tl.to('#pspot', { ...box, duration: 0.7, ease: 'power3.inOut' }, t);
      pSpot = true; SFX.push({ t: t + 0.5, name: 'pop', gain: 0.6 }); }
    else if (pSpot) { tl.to('#pspot', { opacity: 0, duration: 0.3 }, t); pSpot = false; }
  }
  function phoneOff(t) {
    if (!phoneOn) return; tl.to('#phone', { opacity: 0, x: -420, duration: 0.5, ease: 'power3.in' }, t); tl.to('#plabel', { opacity: 0, duration: 0.3 }, t);
    tl.to('#win', { x: 0, scale: 1, duration: 0.6, ease: 'power3.inOut' }, t); phoneOn = false; pSpot = false; tl.set('#pspot', { opacity: 0 }, t + 0.5);
  }
  // ── الهيدر ونطاق الأداة ──
  let headOn = false;
  function head(label, title, t) {
    if (headOn) tl.to('#head', { opacity: 0, x: 30, duration: 0.25 }, t - 0.3);
    tl.set('#badgeTxt', { textContent: label }, t); tl.set('#title', { textContent: title }, t);
    tl.fromTo('#head', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, t); headOn = true;
  }
  const SCOPE = { all: ['عند الكل', 'fa-circle-check'], centers: ['المراكز', 'fa-comments'], behavior: ['مراكز تعديل السلوك', 'fa-hands-holding-child'],
                  school_behavior: ['المدارس ومراكز تعديل السلوك', 'fa-school'], manager: ['الإدارة', 'fa-user-tie'], staff_manager: ['الأخصائي والإدارة', 'fa-users'] };
  let scopeCur = null;
  function scope(key, t) {
    if (key === scopeCur) return;
    if (scopeCur) tl.to('#scope', { opacity: 0, y: -10, duration: 0.2 }, t - 0.25);
    if (key) { tl.set('#scopeTxt', { textContent: SCOPE[key][0] }, t); tl.set('#scopeIc', { className: 'fa-solid ' + SCOPE[key][1] }, t);
      tl.fromTo('#scope', { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, t); SFX.push({ t, name: 'pop', gain: 0.5 }); }
    scopeCur = key;
  }
  // ── كروت عايمة ──
  const CP = [[150, 300, -6], [1480, 360, 5], [140, 640, 4], [1500, 700, -5]];
  function chips(list, a, endT) {
    list.forEach(([k, txt, ic], j) => { const d = document.createElement('div'); d.className = 'chip ' + (j % 2 ? 'white' : 'blue');
      d.innerHTML = (ic ? '<i class="fa-solid ' + ic + '"></i>' : '') + txt; $('chips').appendChild(d);
      const [x, y, r] = CP[j % 4]; Object.assign(d.style, { left: x + 'px', top: y + 'px' });
      const at = W(a, k) - 0.05;
      tl.fromTo(d, { opacity: 0, scale: 0.6, rotation: 0, x: x < 900 ? -120 : 120 }, { opacity: 1, scale: 1, rotation: r, x: 0, duration: 0.45, ease: 'back.out(1.6)' }, at);
      tl.to(d, { opacity: 0, scale: 0.85, duration: 0.3 }, endT - 0.3); SFX.push({ t: at, name: 'swish', gain: 0.5 }); });
  }

  // ═══ المقدمة ═══
  tl.set(['#win', '#logo', '#head', '#scope'], { opacity: 0 }, 0);
  tl.set('#intro', { opacity: 1 }, 0);
  tl.fromTo('#iLogo', { opacity: 0, scale: 0.7, filter: 'brightness(0) invert(1) blur(18px)' }, { opacity: 1, scale: 1, filter: 'brightness(0) invert(1) blur(0px)', duration: 0.9, ease: 'power3.out' }, 0.2);
  tl.fromTo('#iTitle', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' }, W(all[0], 4) - 0.1);
  SFX.push({ t: 0.1, name: 'rise', gain: 0.8 });
  const c1 = all[1]; const tx = [1360, 740, 120];
  c1.sc.cards.forEach(([k, txt, ic], j) => { const d = document.createElement('div'); d.className = 'tcard'; d.style.left = tx[j] + 'px'; d.innerHTML = '<i class="fa-solid ' + ic + '"></i>' + txt; $('intro').appendChild(d);
    tl.fromTo(d, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.55, ease: 'back.out(1.5)' }, W(c1, k) - 0.1); SFX.push({ t: W(c1, k) - 0.1, name: 'swish', gain: 0.6 }); });
  const c2 = all[2];
  tl.to('#intro', { opacity: 0, duration: 0.4 }, c2.t0 - 0.2);
  phone('org_kid_home', null, W(c2, c2.sc.phoneAt) - 0.1);

    if (s.mode === 'legend') {

        tl.fromTo(d, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, W(a, k) - 0.05); SFX.push({ t: W(a, k), name: 'pop', gain: 0.6 }); });

    if (s.mode === 'phone') phone(s.phone, s.pfocus, t + 0.1);
    (s.then || []).forEach(([k, ch]) => { const tt = W(a, k) - 0.15;
      if (ch.phone) phone(ch.phone, ch.pfocus, tt);
      else { if (ch.shot) show('main', ch.shot, tt); focus('main', ch.shot || WINS.main.cur, ch.focus || null, tt); }
      if (ch.scope) scope(ch.scope, tt); });
    if (s.chips) chips(s.chips, a, a.next);
  });

  // ═══ الختام ═══
  const O = all.filter(a => a.sc.mode === 'outro'); const o0 = O[0];

}
