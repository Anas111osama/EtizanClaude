<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Etizan sessions ad</title>
<link rel="stylesheet" href="assets/fontawesome/all.min.css">
<style>
@font-face { font-family: 'Cairo'; src: url('assets/cairo.woff2') format('woff2'); font-weight: 200 1000; }
:root { --blue-900: #0A3D91; --blue-700: #0265B5; --blue-500: #1E88D4; --sky-400: #18B1FE; --sky-100: #D9F0FD; --ink: #123161; --ink-2: #4A6690; --sticky: #F5E6A3;
  --shadow-card: 0 18px 40px rgba(4,30,80,.35), 0 3px 8px rgba(4,30,80,.18); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--blue-900); }
body { font-family: 'Cairo', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(165deg, #0A3D91 0%, #0265B5 55%, #1E88D4 100%); }
#grid { position: absolute; inset: -80px; background-image: radial-gradient(rgba(255,255,255,.10) 2.4px, transparent 2.6px); background-size: 54px 54px; }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(24,177,254,.45), rgba(24,177,254,0) 65%); }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 55%, rgba(4,22,60,.45) 100%); }
#badge { position: absolute; top: 150px; left: 50%; display: flex; align-items: center; gap: 16px; padding: 12px 30px 12px 22px; border-radius: 999px;
  background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.28); font-weight: 800; font-size: 34px; white-space: nowrap; opacity: 0; z-index: 40; }
#badge .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--sky-400); box-shadow: 0 0 14px var(--sky-400); }
.scene { position: absolute; inset: 0; opacity: 0; }
.chip { position: absolute; display: inline-flex; align-items: center; gap: 16px; padding: 18px 36px; border-radius: 999px; font-weight: 900; font-size: 46px; box-shadow: var(--shadow-card); opacity: 0; white-space: nowrap; }
.chip.white { background: #fff; color: var(--blue-700); } .chip.ink { background: var(--ink); color: #fff; } .chip.sky { background: var(--sky-400); color: #fff; }
.chip.sticky { background: var(--sticky); color: var(--ink); } .chip.ghost { background: rgba(255,255,255,.12); color: #fff; border: 3px solid rgba(255,255,255,.35); box-shadow: none; }
.big { position: absolute; left: 50px; right: 50px; text-align: center; font-weight: 900; line-height: 1.22; color: #fff; text-shadow: 0 8px 30px rgba(4,22,60,.35); }
.big .w { display: inline-block; opacity: 0; } .big .y { color: var(--sticky); }
.icon-c { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; opacity: 0; box-shadow: var(--shadow-card); }
.strike { position: absolute; height: 16px; border-radius: 10px; background: #FF6B6B; transform-origin: 100% 50%; box-shadow: 0 4px 10px rgba(0,0,0,.25); }
/* الرقم الكبير */
.num { position: absolute; top: 250px; right: 70px; display: flex; align-items: center; gap: 22px; opacity: 0; }
.num .n { width: 150px; height: 150px; border-radius: 44px; background: #fff; color: var(--blue-700); font-weight: 1000; font-size: 104px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); transform: rotate(-6deg); }
.num .t { font-weight: 900; font-size: 62px; line-height: 1.15; text-shadow: 0 6px 24px rgba(4,22,60,.35); }
/* الموبايل */
.phone { position: absolute; width: 500px; height: 1060px; border-radius: 76px; padding: 14px; background: linear-gradient(150deg, #ffffff, #dfe9f8 45%, #b9cbe6); box-shadow: 0 50px 90px rgba(3,20,60,.5), 0 6px 14px rgba(3,20,60,.25); opacity: 0; }
.phone .scr { position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; border-radius: 62px; overflow: hidden; background: #EEF5FD; }
.phone .scr img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
.phone .isl { position: absolute; top: 30px; left: 50%; width: 130px; height: 36px; margin-left: -65px; border-radius: 20px; background: #0b1730; z-index: 6; }
.spot { position: absolute; border-radius: 22px; border: 6px solid var(--sticky); box-shadow: 0 0 0 3000px rgba(4,22,60,.3), 0 0 30px rgba(245,230,163,.8); opacity: 0; z-index: 5; }
.mag { position: absolute; border-radius: 30px; background: #fff no-repeat; box-shadow: 0 30px 60px rgba(3,20,60,.45), 0 0 0 6px var(--sticky); opacity: 0; z-index: 30; }
.card { position: absolute; background: #fff; color: var(--ink); border-radius: 44px; box-shadow: var(--shadow-card); opacity: 0; }
.av { position: absolute; border-radius: 50%; color: #fff; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-card); opacity: 0; border: 6px solid #fff; }
.av .ok { position: absolute; bottom: -4px; left: -4px; width: 34%; height: 34%; border-radius: 50%; background: #1FA971; border: 4px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 40%; }
#cap { position: absolute; left: 50px; right: 50px; top: 1340px; height: 250px; z-index: 50; }
#cap .chunk { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-wrap: wrap; align-content: center; gap: 0 26px; text-align: center; }
#cap .w { display: inline-block; font-weight: 900; font-size: 74px; line-height: 1.3; color: rgba(255,255,255,.38); text-shadow: 0 6px 22px rgba(4,22,60,.45); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="glow" id="g1" style="width:1300px;height:1300px;left:-420px;top:-260px"></div>
  <div class="glow" id="g2" style="width:1100px;height:1100px;left:420px;top:1000px"></div>
  <div id="vig"></div>
  <div id="badge"><span class="dot"></span><span>جلسات اتزان</span></div>
  <div id="scenes"></div>
  <div id="cap"></div>
  <div id="flash"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="script.js"></script>
<script src="times.js"></script>
<script src="rects.js"></script>
<script>
const AR = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function BUILD() {
  const $ = id => document.getElementById(id);
  const tl = gsap.timeline({ paused: true }), SFX = [];
  const T = window.TIMES.lines, VO = window.TIMES.duration, DUR = VO + 2.6;
  const LN = SCRIPT[0].lines.map((l, i) => ({ t: l.t, t0: T[i].start, t1: T[i].end, wt: T[i].w, next: T[i + 1] ? T[i + 1].start : VO }));
  const W = (i, k) => { const a = LN[i], v = a.wt && a.wt[k]; return v != null ? v : a.t0 + (a.t1 - a.t0) * k / a.t.split(/\s+/).length; };
  const fx = (name, t, gain = 1) => SFX.push({ t: +t.toFixed(3), name, gain });
  const px = v => v + 'px';
  const el = (tag, cls, html, parent, style) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; if (style) Object.assign(d.style, style); (parent || document.body).appendChild(d); return d; };
  const scene = (a, b) => { const sc = el('div', 'scene', null, $('scenes')); tl.fromTo(sc, { opacity: 0 }, { opacity: 1, duration: 0.3 }, a); if (b != null) tl.to(sc, { opacity: 0, duration: 0.3 }, b); return sc; };
  const pop = (node, t, rot = 0, s = 'pop', g = 0.7) => { tl.fromTo(node, { opacity: 0, scale: 0.5, rotation: 0 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.45, ease: 'back.out(1.8)' }, t); if (s) fx(s, t, g); return node; };
  const chip = (sc, html, cls, x, y) => el('div', 'chip ' + cls, html, sc, { left: px(x), top: px(y) });
  const center = (node, y) => { node.style.left = '50%'; node.style.top = px(y); gsap.set(node, { xPercent: -50 }); return node; };
  const cpop = (sc, html, cls, y, t, rot = 0, s = 'pop') => pop(center(chip(sc, html, cls, 0, y), y), t, rot, s);
  function words(sc, html, y, size, at, cls) {  // html: كلمات بمسافات؛ *كلمة* = صفرا
    const b = el('div', 'big', null, sc, { top: px(y), fontSize: px(size) });
    const ws = html.split(/\s+/);
    b.innerHTML = ws.map(w => w === '|' ? '<br>' : '<span class="w' + (/^\*.*\*$/.test(w) ? ' y' : '') + '">' + w.replace(/^\*|\*$/g, '') + '</span>').join(' ');
    b.querySelectorAll('.w').forEach((w, j) => tl.fromTo(w, { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'back.out(2)' }, at[Math.min(j, at.length - 1)] - 0.06));
    return b;
  }
  function number(sc, n, title, t) {
    const d = el('div', 'num', '<div class="n">' + AR(n) + '</div><div class="t">' + title + '</div>', sc);
    tl.fromTo(d, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, t);
    tl.fromTo(d.querySelector('.n'), { scale: 2.2, rotation: 20 }, { scale: 1, rotation: -6, duration: 0.45, ease: 'back.out(1.6)' }, t); fx('slap', t + 0.1, 0.9);
    return d;
  }
  // ── موبايل بشاشة حقيقية ──
  const PW = 472; const K = PW / 390;
  function phone(sc, shot, x, y, s = 1) {
    const p = el('div', 'phone', '<div class="scr"><img src="../screens/' + shot + '.png"></div><div class="isl"></div>', sc, { left: px(x), top: px(y) });
    gsap.set(p, { scale: s, transformOrigin: '50% 50%' }); p.shot = shot; return p;
  }
  const R = (shot, key) => window.RECTS[shot].rects[key];
  function scrollTo(p, y, t, d = 0.6) { tl.to(p.querySelector('img'), { y: -y * K, duration: d, ease: 'power2.inOut' }, t); }
  function spot(p, key, t, t2, pad = 8, dy = 0) {
    const r = R(p.shot, key), s = el('div', 'spot', null, p.querySelector('.scr'), { left: px(r.x * K - pad), top: px((r.y - dy) * K - pad), width: px(r.w * K + pad * 2), height: px(r.h * K + pad * 2) });
    tl.fromTo(s, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power2.out' }, t); if (t2) tl.to(s, { opacity: 0, duration: 0.25 }, t2); return s;
  }
  function mag(sc, shot, key, z, cx, cy, t, t2, pad = 10) {   // نسخة مكبّرة من جزء من الشاشة
    const r = R(shot, key), w = (r.w + pad * 2) * z, h = (r.h + pad * 2) * z;
    const m = el('div', 'mag', null, sc, { left: px(cx - w / 2), top: px(cy - h / 2), width: px(w), height: px(h),
      backgroundImage: 'url(../screens/' + shot + '.png)', backgroundSize: px(390 * z) + ' auto', backgroundPosition: px(-(r.x - pad) * z) + ' ' + px(-(r.y - pad) * z) });
    tl.fromTo(m, { opacity: 0, scale: 0.4, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, t); fx('whoosh', t, 0.6);
    if (t2) tl.to(m, { opacity: 0, scale: 0.8, duration: 0.25 }, t2); return m;
  }
  const phoneIn = (p, t, from = { y: 900, rotation: 8 }) => { tl.fromTo(p, Object.assign({ opacity: 0 }, from), { opacity: 1, y: 0, x: 0, rotation: 0, duration: 0.7, ease: 'power3.out' }, t); fx('whoosh', t, 0.8); };
  function avatar(sc, ch, c1, c2, x, y, size, ok = true) {
    return el('div', 'av', ch + (ok ? '<span class="ok"><i class="fa-solid fa-check"></i></span>' : ''), sc, { left: px(x), top: px(y), width: px(size), height: px(size), fontSize: px(size * 0.42), background: 'linear-gradient(135deg,' + c1 + ',' + c2 + ')' });
  }

  // ── الكابشن ──
  const FIX = { 3: { 6: 'لـADHD', 7: '', 8: '', 9: '' } };
  LN.forEach((a, i) => {
    const ws = a.t.split(/\s+/).map((w, k) => (FIX[i] && FIX[i][k] != null ? FIX[i][k] : w).replace(/[ِ«»]/g, '').replace(/(\.\.\.|[.:،,])+$/, ''));
    const chunks = []; let cur = [];
    a.t.split(/\s+/).forEach((w, k) => { if (!ws[k]) return; cur.push(k); if (cur.length >= 4 || /[.،,؟?:!»]$|\.\.\.$/.test(w) && cur.length >= 2) { chunks.push(cur); cur = []; } });
    if (cur.length) { if (cur.length === 1 && chunks.length && chunks[chunks.length - 1].length < 4) chunks[chunks.length - 1].push(...cur); else chunks.push(cur); }
    chunks.forEach((ks, c) => {
      const box = el('div', 'chunk', null, $('cap'));
      box.innerHTML = ks.map(k => '<span class="w">' + ws[k] + '</span>').join('');
      const t0 = W(i, ks[0]) - 0.12, t1 = c < chunks.length - 1 ? W(i, chunks[c + 1][0]) - 0.12 : a.next - 0.12;
      tl.set(box, { display: 'flex' }, t0); tl.fromTo(box, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.18, ease: 'power2.out' }, t0);
      box.querySelectorAll('.w').forEach((w, j) => {
        const tw = W(i, ks[j]) - 0.03;
        tl.fromTo(w, { color: 'rgba(255,255,255,.38)', scale: 1 }, { color: '#F5E6A3', scale: 1.08, duration: 0.12 }, tw);
        tl.to(w, { color: '#ffffff', scale: 1, duration: 0.15 }, j < ks.length - 1 ? W(i, ks[j + 1]) - 0.03 : Math.min(t1, tw + 0.5));
      });
      tl.set(box, { display: 'none' }, t1);
    });
  });
  gsap.set('#badge', { xPercent: -50 });
  tl.to('#g1', { x: 160, y: 120, duration: DUR, ease: 'sine.inOut' }, 0); tl.to('#g2', { x: -200, y: -160, duration: DUR, ease: 'sine.inOut' }, 0);
  tl.to('#grid', { y: 54 * 3, duration: DUR, ease: 'none' }, 0);

  // ═══ ٠ · مش بس تطبيق… ورا التطبيق فريق ═══
  { const sc = scene(0, LN[1].t0 + 0.1);
    const p = phone(sc, 'home', 290, 300, 0.92); phoneIn(p, 0.05, { y: 700, rotation: -6 });
    scrollTo(p, 60, 0.6, 1.2);
    const a = words(sc, 'مش *بس* تطبيق', 170, 96, [W(0, 1), W(0, 2), W(0, 3)]);
    tl.to(a, { opacity: 0, y: -40, duration: 0.3 }, W(0, 7) - 0.2);
    const tg = W(0, 7) - 0.1;
    tl.to(p, { scale: 0.62, y: -150, x: 0, rotation: 0, duration: 0.7, ease: 'power3.inOut' }, tg); fx('swish', tg, 0.8);
    const team = [['م', '#0876B2', '#3269DB'], ['ك', '#7C3AED', '#4F46E5'], ['ي', '#0EA5A4', '#0284C7'], ['س', '#F59E0B', '#EA580C'], ['ه', '#EC4899', '#DB2777']];
    const pos = [[440, 1020, 200], [190, 960, 170], [710, 960, 170], [40, 830, 140], [900, 830, 140]];
    team.forEach(([c, a1, a2], j) => { const [x, y, s] = pos[j]; const av = avatar(sc, c, a1, a2, x - (j > 2 ? 0 : 0), y, s);
      tl.fromTo(av, { opacity: 0, y: 120, scale: 0.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, W(0, 8) + [0, 0.12, 0.2, 0.3, 0.38][j]); });
    fx('pop', W(0, 8), 0.7);
    const fc = cpop(sc, '<i class="fa-solid fa-user-group"></i>فريق كامل', 'sticky', 1250, W(0, 10) - 0.05, -2, 'slap');
    // واحد منهم بيقرّب ← جلسة
    const t1 = LN[1].t0;
    tl.to(p, { opacity: 0, y: -400, duration: 0.5, ease: 'power2.in' }, t1 - 0.05);
    tl.to(fc, { opacity: 0, duration: 0.25 }, t1);
    tl.to(sc.querySelectorAll('.av'), { opacity: 0, scale: 0.6, duration: 0.3 }, W(1, 4) - 0.1);
  }
  // ═══ ١ · جلسة من موبايلك ═══
  { const sc = scene(LN[1].t0 - 0.1, LN[2].t0 - 0.3);
    const p = el('div', 'phone', '<div class="scr" style="background:linear-gradient(170deg,#173b74,#0b2550)"></div><div class="isl"></div>', sc, { left: px(304), top: px(260) });
    const scr = p.querySelector('.scr');
    const big = avatar(scr, 'م', '#0876B2', '#3269DB', 106, 250, 240, true); big.style.opacity = 1;
    el('div', null, 'أ. منى · أخصائية', scr, { position: 'absolute', top: '540px', width: '100%', textAlign: 'center', fontWeight: 800, fontSize: '34px', color: '#fff' });
    const me = el('div', null, '<i class="fa-solid fa-user"></i><b>إنتِي</b>', scr, { position: 'absolute', right: '30px', top: '640px', width: '170px', height: '220px', borderRadius: '30px', background: 'linear-gradient(160deg,#5DB7F4,#2A7FD0)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '12px', fontSize: '70px', color: 'rgba(255,255,255,.9)', border: '4px solid rgba(255,255,255,.6)' });
    me.querySelector('b').style.fontSize = '30px';
    const bar = el('div', null, '<span style="background:rgba(255,255,255,.18)"><i class="fa-solid fa-microphone"></i></span><span style="background:#E5484D"><i class="fa-solid fa-phone"></i></span><span style="background:rgba(255,255,255,.18)"><i class="fa-solid fa-video"></i></span>', scr, { position: 'absolute', bottom: '60px', left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: '30px' });
    bar.querySelectorAll('span').forEach(s => Object.assign(s.style, { width: '96px', height: '96px', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '40px', color: '#fff' }));
    tl.fromTo(p, { opacity: 0, scale: 0.6, y: 300 }, { opacity: 1, scale: 0.92, y: 0, duration: 0.6, ease: 'back.out(1.4)' }, W(1, 4) - 0.1); fx('whoosh', W(1, 4) - 0.1, 0.8);
    tl.fromTo(big, { scale: 0.3 }, { scale: 1, duration: 0.5, ease: 'back.out(2)' }, W(1, 4) + 0.1);
    tl.fromTo(me, { opacity: 0, x: 80 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, W(1, 6) - 0.1);
    const live = cpop(sc, '<i class="fa-solid fa-video"></i>جلسة أونلاين', 'white', 1230, W(1, 6) - 0.05, -2);
    tl.to(p, { y: -16, duration: 0.6, yoyo: true, repeat: 3, ease: 'sine.inOut' }, W(1, 6) + 0.4);
  }
  // ═══ ٢ · إيه اللي يخلّي جلسة اتزان مختلفة؟ ═══
  { const sc = scene(LN[2].t0 - 0.3, LN[3].t0 - 0.2);
    const q = words(sc, 'إيه اللي يخلّي | جلسة اتزان | *مختلفة؟*', 470, 120, [W(2, 1), W(2, 2), W(2, 3), W(2, 4), W(2, 5), W(2, 6)]);
    fx('rise', W(2, 4) - 0.6, 0.7); fx('impact', W(2, 6), 0.9);
    tl.fromTo('#flash', { opacity: 0.3 }, { opacity: 0, duration: 0.3, immediateRender: false }, W(2, 6) + 0.02);
    const ul = el('div', null, null, sc, { position: 'absolute', left: '250px', right: '250px', top: '900px', height: '18px', borderRadius: '10px', background: 'var(--sticky)', transformOrigin: '100% 50%' });
    tl.fromTo(ul, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, W(2, 6) + 0.1);
    tl.fromTo('#badge', { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.5 }, W(2, 6) + 0.3);
    tl.to(q, { scale: 1.06, duration: 1.2, ease: 'sine.out' }, W(2, 6));
  }
  // ═══ ٣ · ١ متخصصة في ADHD ═══
  { const sc = scene(LN[3].t0 - 0.2, LN[4].t0 - 0.25);
    number(sc, 1, 'متخصصة<br>في ADHD', LN[3].t0 - 0.15);
    const core = el('div', 'icon-c', '<img src="assets/logo-mark.png" style="width:62%">', sc, { left: '390px', top: '560px', width: '300px', height: '300px', background: '#fff' });
    pop(core, W(3, 1) - 0.1, 0, 'pop', 0.8);
    const tag = el('div', 'chip ink', 'ADHD', sc, { left: '0', top: '820px', fontSize: '56px', letterSpacing: '4px', direction: 'ltr' }); center(tag, 820);
    pop(tag, W(3, 6) - 0.05, -3, 'slap', 0.9);
    tl.to(core, { scale: 0.8, y: -40, duration: 0.5, ease: 'power2.inOut' }, W(3, 10) - 0.2);
    const world = [['fa-book-open', 'المذاكرة', 140, 520], ['fa-person-running', 'الحركة الكتير', 690, 540], ['fa-clock', 'خناقة الصبح', 90, 1010], ['fa-brain', 'النسيان', 760, 1030], ['fa-tablet-screen-button', 'التابلت', 430, 1160]];
    world.forEach(([ic, t, x, y], j) => { const c = chip(sc, '<i class="fa-solid ' + ic + '"></i>' + t, 'white', x, y); c.style.fontSize = '38px';
      tl.fromTo(c, { opacity: 0, scale: 0.4, rotation: 0 }, { opacity: 1, scale: 1, rotation: [-4, 3, 3, -3, 2][j], duration: 0.4, ease: 'back.out(2)' }, W(3, 13) + j * 0.17); fx('pop', W(3, 13) + j * 0.17, 0.5); });
    tl.to(tag, { opacity: 0, duration: 0.2 }, W(3, 13) - 0.1);
  }
